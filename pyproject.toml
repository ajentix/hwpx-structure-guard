[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpx-structure-guard"
version = "0.1.0"
description = "Bounded, read-only HWPX package checks and ordered XML comparison"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ajentix contributors"}]
dependencies = []

[project.scripts]
hwpx-guard = "hwpx_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
